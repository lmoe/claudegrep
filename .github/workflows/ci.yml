name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  INSTA_UPDATE: "no"

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain and the components that rust-toolchain.toml names.
      - name: Install the toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Cache the model and ONNX Runtime
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/claudegrep
            ~/Library/Caches/claudegrep
          key: model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/embed/mod.rs', 'src/embed/runtime.rs') }}

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D warnings

      # Runs before the other tests, so one process downloads the model and ONNX Runtime and the CLI tests, which
      # start many at once, find both in the cache.
      - name: Test the real model
        run: cargo test --locked --lib -- --ignored

      - name: Test
        run: cargo test --locked --no-fail-fast
